name: Examples CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: examples-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whitespace
        run: git diff --check

      - name: Validate template descriptors
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const projects = [
            'chat-immersive.animeproj',
            'idol-clause.animeproj',
            'immersive-chat-cloud.animeproj',
          ];
          for (const project of projects) {
            const root = `${project}`;
            const pkg = JSON.parse(fs.readFileSync(`${root}/package.json`, 'utf8'));
            const identity = JSON.parse(fs.readFileSync(`${root}/.seashort/runtime-identity.json`, 'utf8'));
            if (pkg.dependencies?.['@seachat/sdk'] !== 'file:../../sdks/seachat-sdk') {
              throw new Error(`${project}: @seachat/sdk must use the shared SDK source path`);
            }
            if (pkg.dependencies?.['@seashort/card-kit'] !== 'file:../../sdks/card-kit') {
              throw new Error(`${project}: @seashort/card-kit must use the shared card-kit source path`);
            }
            if (!identity.kind) throw new Error(`${project}: runtime identity missing kind`);
            console.log(`${project}: ${identity.kind}`);
          }
          NODE
